[package]
name = "llim-tui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A read-only multi-team Linear TUI monitor with DuckDB 2.0 Quack protocol storage"
authors = ["Paul Iannazzo <pauli>"]

[[bin]]
name = "llim"
path = "src/main.rs"

[dependencies]
arboard = { version = "3.6.0", default-features = false, features = ["windows-sys", "wl-clipboard-rs"] }
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.45", features = ["derive"] }
color-eyre = "0.6.5"
compact_str = { version = "0.9", features = ["serde"] }
confy = "1.0.0"
crossterm = "0.28.1"
derive_builder = "0.20.2"
directories = "6.0.0"
itertools = "0.14.0"
once_cell = "1.21.3"
open = "5.3.2"
ratatui = { version = "0.29.0", features = ["unstable-widget-ref"] }
reqwest = { version = "0.12.8", features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.135"
tachyonfx = "0.18.0"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
tui-input = "0.14.0"
unicode-width = "0.2"
url = "2.5.4"

[dev-dependencies]
tempfile = "3.14"
wiremock = "0.6"
